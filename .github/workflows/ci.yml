name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "ci-secret-not-used-in-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` runs the postinstall `prisma generate`, so the client types
      # (used by tsc) are available before typecheck.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Catches Next-specific build failures (RSC/client boundaries, metadata,
      # static generation) that tsc/vitest don't. All routes are dynamic, so no
      # DB seed is needed at build time.
      - run: npm run build
